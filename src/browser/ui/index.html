<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slime Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Sidebar -->
  <div id="sidebar" role="navigation">
    <!-- Sidebar Header -->
    <div id="sidebar-header">
      <div class="logo-icon"><img src="../../../Slime1.ico" alt="S" width="20" height="20"></div>
      <span class="logo-text">Slime</span>
      <button id="btn-pin-sidebar" class="sidebar-pin-btn" title="Pin sidebar" aria-label="Pin sidebar">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M9.5 1.5L14.5 6.5L10 11L8.5 9.5L5.5 12.5L3.5 12.5L3.5 10.5L6.5 7.5L5 6L9.5 1.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" fill="none"/></svg>
      </button>
    </div>

    <!-- URL Bar in Sidebar -->
    <div id="sidebar-nav">
      <div id="nav-buttons">
        <button class="nav-btn" id="btn-back" title="Back" disabled aria-label="Go back">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="nav-btn" id="btn-forward" title="Forward" disabled aria-label="Go forward">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="nav-btn" id="btn-reload" title="Reload" aria-label="Reload page">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2.5 8a5.5 5.5 0 1 1 1.3 3.5M2.5 14v-3h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div id="url-bar-wrapper">
        <div id="url-bar-container">
          <input type="text" id="url-bar" placeholder="Search or enter URL..." spellcheck="false" autocomplete="off" aria-label="Address bar">
          <button id="btn-bookmark" class="url-action-btn" title="Bookmark this page (Ctrl+D)" aria-label="Toggle bookmark">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 2h8a1 1 0 0 1 1 1v11.5l-5-3-5 3V3a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.2" fill="none" id="bookmark-icon-path"/></svg>
          </button>
        </div>
        <div id="autocomplete-dropdown" role="listbox" aria-label="Suggestions"></div>
      </div>
    </div>

    <!-- New Tab Button -->
    <div id="new-tab-area">
      <button id="new-tab-btn" class="sidebar-btn" title="New Tab (Ctrl+T)" aria-label="New tab">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span class="sidebar-btn-label">New Tab</span>
      </button>
    </div>

    <!-- Vertical Tabs -->
    <div id="tabs-container" role="tablist"></div>

    <!-- Sidebar Footer -->
    <div id="sidebar-footer">
      <button class="sidebar-btn" id="btn-bookmarks-panel" title="Bookmarks" aria-label="Bookmarks">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 2h8a1 1 0 0 1 1 1v11.5l-5-3-5 3V3a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
        <span class="sidebar-btn-label">Bookmarks</span>
      </button>
      <button class="sidebar-btn" id="btn-history" title="History" aria-label="History">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3.5V8l3 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
        <span class="sidebar-btn-label">History</span>
      </button>
      <button class="sidebar-btn" id="btn-downloads" title="Downloads" aria-label="Downloads">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2v8m0 0l-3-3m3 3l3-3M3 12h10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="sidebar-btn-label">Downloads</span>
        <span class="download-badge" id="download-badge"></span>
      </button>
      <div id="blocked-counter" title="Ads blocked">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 1.5L2 4v4.5c0 3.5 2.5 5.5 6 6.5 3.5-1 6-3 6-6.5V4L8 1.5z" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
        <span id="blocked-count">0</span>
      </div>
      <button class="sidebar-btn" id="macros-btn" title="Macros" aria-label="Macros">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        <span class="sidebar-btn-label">Macros</span>
      </button>
      <button class="sidebar-btn" id="btn-passwords" title="Passwords" aria-label="Passwords">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M5 7V5a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg>
        <span class="sidebar-btn-label">Passwords</span>
      </button>
      <button class="sidebar-btn" id="btn-settings" title="Settings" aria-label="Settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.2"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M2.9 2.9l1.4 1.4M11.7 11.7l1.4 1.4M13.1 2.9l-1.4 1.4M4.3 11.7l-1.4 1.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span class="sidebar-btn-label">Settings</span>
      </button>
    </div>
  </div>

  <!-- History Panel -->
  <div id="history-panel" class="panel-overlay" style="display:none;">
    <div class="panel-header">
      <h3>History</h3>
      <div class="panel-actions">
        <button id="history-clear-btn" class="panel-action-btn" title="Clear History">Clear All</button>
        <button class="panel-close-btn" id="history-close">&times;</button>
      </div>
    </div>
    <div class="panel-search">
      <input type="text" id="history-search" placeholder="Search history..." spellcheck="false">
    </div>
    <div id="history-list" class="panel-list"></div>
  </div>

  <!-- Bookmarks Panel -->
  <div id="bookmarks-panel" class="panel-overlay" style="display:none;">
    <div class="panel-header">
      <h3>Bookmarks</h3>
      <div class="panel-actions">
        <button class="panel-close-btn" id="bookmarks-close">&times;</button>
      </div>
    </div>
    <div class="panel-search">
      <input type="text" id="bookmarks-search" placeholder="Search bookmarks..." spellcheck="false">
    </div>
    <div id="bookmarks-list" class="panel-list"></div>
  </div>

  <!-- Downloads Panel -->
  <div id="downloads-panel" class="panel-overlay" style="display:none;">
    <div class="panel-header">
      <h3>Downloads</h3>
      <div class="panel-actions">
        <button class="panel-close-btn" id="downloads-close">&times;</button>
      </div>
    </div>
    <div id="downloads-list" class="panel-list"></div>
  </div>

  <!-- Passwords Panel -->
  <div id="passwords-panel" class="panel-overlay" style="display:none;">
    <div class="panel-header">
      <h3>Saved Passwords</h3>
      <div class="panel-actions">
        <button class="panel-close-btn" id="passwords-close">&times;</button>
      </div>
    </div>
    <div class="panel-search">
      <input type="text" id="passwords-search" placeholder="Search passwords..." spellcheck="false">
    </div>
    <div id="passwords-list" class="panel-list"></div>
  </div>

  <!-- Macros Panel -->
  <div id="macros-panel" class="panel-overlay" style="display:none;">
    <div class="panel-header">
      <h3>Macros</h3>
      <div class="panel-actions">
        <button class="panel-action-btn" id="macro-create-btn">+ New Macro</button>
        <button class="panel-close-btn" id="macros-panel-close">&times;</button>
      </div>
    </div>
    <div class="panel-list" id="macros-list">
      <!-- Macro items rendered by JS -->
    </div>
  </div>

  <!-- Macro Editor Modal -->
  <div id="macro-editor-modal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="macro-editor-title">New Macro</h3>
        <button class="panel-close-btn" id="macro-editor-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="macro-name-input" placeholder="z.B. Mail anmelden" />
        </div>
        <div class="form-group">
          <label>Icon (Emoji)</label>
          <input type="text" id="macro-icon-input" placeholder="&#128231;" maxlength="2" />
        </div>
        <div id="macro-steps-container">
          <!-- Steps rendered dynamically -->
        </div>
        <button class="panel-action-btn" id="macro-add-step-btn">+ Add Step</button>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="macro-editor-cancel">Cancel</button>
        <button class="btn-primary" id="macro-editor-save">Save Macro</button>
      </div>
    </div>
  </div>

  <!-- Password Save Bar -->
  <div id="password-bar" style="display:none;" role="alert" aria-live="assertive">
    <span id="password-bar-text">Save password for this site?</span>
    <div class="password-bar-actions">
      <button id="password-bar-save" class="password-bar-btn save">Save</button>
      <button id="password-bar-dismiss" class="password-bar-btn dismiss">Dismiss</button>
    </div>
  </div>

  <!-- Main Content Area -->
  <div id="main" role="main">
    <!-- Titlebar (slim, just for dragging + window controls) -->
    <div id="titlebar">
      <div id="titlebar-drag"></div>
      <div id="window-controls">
        <button class="traffic-btn traffic-minimize" id="btn-minimize" title="Minimize" aria-label="Minimize window">
          <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1.5 4h5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
        <button class="traffic-btn traffic-maximize" id="btn-maximize" title="Maximize" aria-label="Maximize window">
          <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1.5 1.5h5v5h-5z" stroke="currentColor" stroke-width="1" stroke-linecap="round" fill="none"/></svg>
        </button>
        <button class="traffic-btn traffic-close" id="btn-close" title="Close" aria-label="Close window">
          <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1.5 1.5l5 5M6.5 1.5l-5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <!-- Webview Container -->
    <div id="webview-container"></div>

    <!-- New Tab Page -->
    <div id="new-tab-page" style="display: none;">
      <div class="ntp-content">
        <div class="ntp-logo-wrap">
          <div class="ntp-logo">S</div>
        </div>
        <p class="ntp-subtitle">What do you want to explore?</p>
        <div class="ntp-search">
          <input type="text" id="ntp-search-input" placeholder="Search the web..." autofocus>
        </div>
        <div class="ntp-shortcuts" id="ntp-shortcuts">
          <a class="ntp-shortcut" data-url="https://youtube.com">
            <div class="ntp-shortcut-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.9 31.9 0 0 0 0 12a31.9 31.9 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1c.3-1.9.5-3.8.5-5.8s-.2-3.9-.5-5.8zM9.5 15.6V8.4l6.3 3.6-6.3 3.6z"/></svg>
            </div>
            <span>YouTube</span>
          </a>
          <a class="ntp-shortcut" data-url="https://github.com">
            <div class="ntp-shortcut-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.5-1.4-1.3-1.8-1.3-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.3 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17 4.7 18 5 18 5c.7 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg>
            </div>
            <span>GitHub</span>
          </a>
          <a class="ntp-shortcut" data-url="https://reddit.com">
            <div class="ntp-shortcut-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8.5" cy="11" r="1.5"/><circle cx="15.5" cy="11" r="1.5"/><path d="M8.5 15c1 1.2 2.3 1.5 3.5 1.5s2.5-.3 3.5-1.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            </div>
            <span>Reddit</span>
          </a>
          <a class="ntp-shortcut" data-url="https://wikipedia.org">
            <div class="ntp-shortcut-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12.1 21.3L5.6 7.5h2.1l4.4 10 4.4-10h2.1l-6.5 13.8z"/></svg>
            </div>
            <span>Wikipedia</span>
          </a>
        </div>
      </div>
    </div>

    <!-- Settings Page -->
    <div id="settings-page" style="display: none;">
      <div class="settings-content">
        <h2 class="settings-title">Settings</h2>

        <div class="settings-section">
          <h3 class="settings-section-title">Search</h3>
          <div class="settings-group">
            <label class="settings-label">Search Engine</label>
            <select id="setting-search-engine" class="settings-select">
              <option value="google">Google</option>
              <option value="duckduckgo">DuckDuckGo</option>
              <option value="bing">Bing</option>
              <option value="custom">Custom</option>
            </select>
          </div>
          <div class="settings-group" id="custom-search-group" style="display:none;">
            <label class="settings-label">Custom Search URL</label>
            <input type="text" id="setting-custom-search" class="settings-input" placeholder="https://search.example.com/?q=%s" spellcheck="false">
            <span class="settings-hint">Use %s for the search query</span>
          </div>
        </div>

        <div class="settings-section">
          <h3 class="settings-section-title">General</h3>
          <div class="settings-group">
            <label class="settings-label">Homepage</label>
            <input type="text" id="setting-homepage" class="settings-input" placeholder="slime://newtab" spellcheck="false">
          </div>
          <div class="settings-group settings-toggle-group">
            <label class="settings-label">Restore tabs on startup</label>
            <label class="settings-toggle">
              <input type="checkbox" id="setting-restore-tabs">
              <span class="settings-toggle-slider"></span>
            </label>
          </div>
          <div class="settings-group">
            <label class="settings-label">Default Zoom Level</label>
            <select id="setting-zoom" class="settings-select">
              <option value="75">75%</option>
              <option value="80">80%</option>
              <option value="90">90%</option>
              <option value="100">100%</option>
              <option value="110">110%</option>
              <option value="125">125%</option>
              <option value="150">150%</option>
            </select>
          </div>
        </div>

        <div class="settings-section">
          <h3 class="settings-section-title">Appearance</h3>
          <div class="settings-group">
            <label class="settings-label">Accent Color</label>
            <div class="color-picker-row">
              <button class="color-swatch" data-color="#4ade80" style="background:#4ade80" title="Green"></button>
              <button class="color-swatch" data-color="#60a5fa" style="background:#60a5fa" title="Blue"></button>
              <button class="color-swatch" data-color="#c084fc" style="background:#c084fc" title="Purple"></button>
              <button class="color-swatch" data-color="#f472b6" style="background:#f472b6" title="Pink"></button>
              <button class="color-swatch" data-color="#fb923c" style="background:#fb923c" title="Orange"></button>
              <button class="color-swatch" data-color="#facc15" style="background:#facc15" title="Yellow"></button>
              <button class="color-swatch" data-color="#f87171" style="background:#f87171" title="Red"></button>
              <button class="color-swatch" data-color="#e4e4e7" style="background:#e4e4e7" title="White"></button>
              <input type="color" id="setting-accent-custom" class="color-input" title="Custom color">
            </div>
          </div>
          <div class="settings-group">
            <label class="settings-label">Background Color</label>
            <div class="color-picker-row">
              <button class="bg-swatch" data-color="#4ade80" style="background:#4ade80" title="Green"></button>
              <button class="bg-swatch" data-color="#60a5fa" style="background:#60a5fa" title="Blue"></button>
              <button class="bg-swatch" data-color="#c084fc" style="background:#c084fc" title="Purple"></button>
              <button class="bg-swatch" data-color="#f472b6" style="background:#f472b6" title="Pink"></button>
              <button class="bg-swatch" data-color="#fb923c" style="background:#fb923c" title="Orange"></button>
              <button class="bg-swatch" data-color="#facc15" style="background:#facc15" title="Yellow"></button>
              <button class="bg-swatch" data-color="#f87171" style="background:#f87171" title="Red"></button>
              <button class="bg-swatch" data-color="#e4e4e7" style="background:#e4e4e7" title="White"></button>
              <input type="color" id="setting-bg-custom" class="color-input" title="Custom background">
            </div>
          </div>
          <div class="settings-group">
            <label class="settings-label">Background Opacity <span id="opacity-value">100%</span></label>
            <input type="range" id="setting-bg-opacity" class="settings-slider" min="30" max="100" value="100">
          </div>
          <div class="settings-group settings-toggle-group">
            <label class="settings-label">Glass Morphism</label>
            <label class="settings-toggle">
              <input type="checkbox" id="setting-glass">
              <span class="settings-toggle-slider"></span>
            </label>
          </div>
        </div>

        <div class="settings-section">
          <h3 class="settings-section-title">Privacy</h3>
          <div class="settings-group settings-toggle-group">
            <label class="settings-label">Adblocker</label>
            <label class="settings-toggle">
              <input type="checkbox" id="setting-adblocker">
              <span class="settings-toggle-slider"></span>
            </label>
          </div>
        </div>

        <div class="settings-footer">
          <span class="settings-version">Slime Browser v1.5.1</span>
        </div>
      </div>
    </div>
  </div>

  <script src="browser.js"></script>
</body>
</html>
